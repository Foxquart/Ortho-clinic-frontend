<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>OrthoClinic</title>
    <script>
      // Resolve the theme before first paint so there is never a light flash
      // on a dark-mode machine. Mirrors the contract in src/styles/theme.css:
      // an explicit choice stamps data-theme, "system" leaves it unset.
      ;(function () {
        try {
          var t = localStorage.getItem('ortho-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
