<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>OrthoClinic</title>
    <script>
      // Resolve the theme before first paint so there is never a wrong-theme
      // flash. Mirrors the contract in src/styles/theme.css: an explicit choice
      // stamps data-theme, "system" leaves it unset. When nothing is stored the
      // default is LIGHT — stamped here so a dark-OS machine does not flash
      // dark before ThemeProvider mounts. Keep in sync with readStoredChoice()
      // in src/app/ThemeProvider.tsx.
      ;(function () {
        try {
          var t = localStorage.getItem('ortho-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
          else if (t !== 'system') document.documentElement.dataset.theme = 'light'
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
